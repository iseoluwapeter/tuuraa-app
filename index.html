<!doctype html>
<html lang="en">

<head>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- iOS PWA behavior (Apple doesn't fully read the manifest) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tuuraa" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Android/theme -->
  <meta name="theme-color" content="#0F3D2E" />

  <!-- Splash screens (iOS needs static image links, one per device size) -->
  <link rel="apple-touch-startup-image" href="/splash/iphone-15-pro.png"
    media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
  <!-- generate a set with a tool like pwa-asset-generator; don't hand-craft every size -->
</head>



<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
